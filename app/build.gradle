plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
}

// Firebase plugins need app/google-services.json (kept out of git, see docs/FIREBASE_SETUP.md).
// Without it the app still builds and runs; analytics becomes a no-op.
if (file('google-services.json').exists()) {
    apply plugin: libs.plugins.google.services.get().pluginId
    apply plugin: libs.plugins.firebase.crashlytics.get().pluginId
} else {
    logger.warn("app/google-services.json not found - building without Firebase config (analytics disabled).")
}

android {
    namespace 'com.rajatnagpure.pcmplayerconverter'
    compileSdk 36

    defaultConfig {
        applicationId "com.rajatnagpure.pcmplayerconverter"
        minSdk 23
        targetSdk 36
        versionCode 12
        versionName "8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // Keep dev/test traffic out of production dashboards.
            // To inspect events in DebugView: ./gradlew installDebug -PanalyticsInDebug=true
            def debugAnalytics = (project.findProperty('analyticsInDebug') ?: 'false').toString()
            manifestPlaceholders = [analyticsCollectionEnabled: debugAnalytics]
            buildConfigField "boolean", "ANALYTICS_ENABLED", debugAnalytics
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [analyticsCollectionEnabled: "true"]
            buildConfigField "boolean", "ANALYTICS_ENABLED", "true"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Robolectric (SDK 36 sandbox) touches FileDescriptor internals on JDK 17+
            jvmArgs "--add-opens=java.base/jdk.internal.access=ALL-UNNAMED", "--add-opens=java.base/java.io=ALL-UNNAMED"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material

    // Compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.androidx.activity.compose
    implementation libs.androidx.navigation.compose

    // Lifecycle
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose

    // Hilt
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.androidx.hilt.navigation.compose

    // Firebase (free tier: Analytics, Crashlytics, Remote Config)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.crashlytics
    implementation libs.firebase.config

    // Testing
    testImplementation libs.junit
    testImplementation libs.mockk
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core.ktx
    testImplementation libs.androidx.test.ext.junit.ktx

    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.compose.ui.test.junit4
    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest
}
