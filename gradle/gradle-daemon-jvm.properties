# Gradle 9 needs JDK 17+ for its daemon; we pin 21 (bundled with Android Studio). With this file Gradle picks a matching local JDK
# (e.g. Android Studio's bundled JBR or any installed JDK 21) even when the shell's
# JAVA_HOME / `java` is older. Regenerate with: ./gradlew updateDaemonJvm --jvm-version=21
toolchainVersion=21
